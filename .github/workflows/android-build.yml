name: Android Build

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Gradle task to run"
        type: choice
        options:
          - assembleDebug
          - assembleRelease
        default: assembleDebug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_HARDLINK: "true"
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: "4G"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      # apiId / apiHash are compile-time constants. Without repository secrets the
      # build still runs with placeholders so pull requests can verify compilation;
      # those APKs cannot sign in.
      - name: Configure build secrets
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          HELPER_BOT_ID: ${{ secrets.HELPER_BOT_ID }}
          HELPER_BOT_USERNAME: ${{ secrets.HELPER_BOT_USERNAME }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          API_ID="${API_ID:-0}"
          API_HASH="${API_HASH:-0123456789abcdef0123456789abcdef}"

          {
            echo "apiId=$API_ID"
            echo "apiHash=$API_HASH"
            echo "helperBotId=${HELPER_BOT_ID:-0}"
            echo "helperBotUsername=${HELPER_BOT_USERNAME}"
            echo "mapsApiKey=${MAPS_API_KEY}"
            echo "sentryDsn=${SENTRY_DSN}"
          } >> local.properties

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
            {
              echo "storeFile=$PWD/keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } >> local.properties
          else
            echo "::warning::No KEYSTORE_BASE64 secret, release builds fall back to debug signing."
          fi

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > TMessagesProj_App/google-services.json
          else
            echo "::warning::No GOOGLE_SERVICES_JSON secret, writing a placeholder so the google-services plugin can run."
            cat > TMessagesProj_App/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "telecat-build",
              "storage_bucket": "telecat-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "tw.nekomimi.nekogram" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Build debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'assembleDebug'
        run: ./gradlew --stacktrace --no-daemon assembleDebug

      - name: Build release APKs
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'assembleRelease'
        run: ./gradlew --stacktrace --no-daemon assembleRelease

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p artifacts
          find TMessagesProj_App/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -lah artifacts

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telecat-apk-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 14
